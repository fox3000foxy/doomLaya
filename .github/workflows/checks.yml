name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest tests.test_authority tests.test_publication
      - run: python scripts/check_publication.py
      - run: python training/finetune.py --data training --validate-only
      - run: python training/finetune.py --data training/v3 --validate-only
